# Optional helper: runs only the MySQL database for local development.
#   docker compose up -d
# Reads DB_PASSWORD from ./.env (see .env.example).
services:
  mysql:
    image: mysql:8.0
    container_name: subsidy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: subsidy_db
    ports:
      - "3306:3306"
    volumes:
      - subsidy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  subsidy_mysql_data:
